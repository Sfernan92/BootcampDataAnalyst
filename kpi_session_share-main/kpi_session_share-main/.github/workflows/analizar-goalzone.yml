name: Arrabal · ejecutar laboratorio GoalZone

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisis:
    name: Descargar, verificar y analizar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas con datos sintéticos
        run: python -m pytest -q tests/
      - name: Descargar GoalZone y ejecutar análisis completo
        run: python lab/analisis.py --output resultados
      - name: Subir resultados como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: analisis-goalzone
          path: resultados/
          retention-days: 30
          if-no-files-found: error

  publicar:
    name: Publicar informe interactivo (opcional)
    needs: analisis
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obtener resultados de la ejecución
        uses: actions/download-artifact@v4
        with:
          name: analisis-goalzone
          path: resultados/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar informe para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: resultados/site/
      - name: Publicar informe
        id: deploy
        uses: actions/deploy-pages@v4
